# Checks that every .zig file is formatted per `zig fmt`. Runs on every push
# (to any branch) and on every pull request, so a drifted commit is flagged
# immediately rather than only being caught at release time.
name: Lint

on:
  push:
  pull_request:

env:
  # Keep in sync with release.yml's ZIG_VERSION.
  ZIG_VERSION: 0.15.1

jobs:
  fmt:
    name: zig fmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        run: |
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" -o /tmp/zig.tar.xz
          tar xf /tmp/zig.tar.xz -C /tmp
          echo "/tmp/zig-x86_64-linux-${ZIG_VERSION}" >> "$GITHUB_PATH"

      - name: Check formatting
        run: zig fmt --check .
